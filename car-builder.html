<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Art of Touge Car Builder</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #101216; color: #eee; font: 600 13px/1.2 system-ui, -apple-system, 'Segoe UI', sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
      canvas { display: block; }
      button { font: inherit; color: #eee; background: #262a31; border: 1px solid #3a404a; border-radius: 8px; padding: 9px 11px; min-height: 38px; cursor: pointer; }
      button:active { background: #3a404a; }
      button.on { background: #e8a33a; color: #111; border-color: #e8a33a; }
      button.go { background: #d0402f; border-color: #d0402f; color: #fff; }
      input[type='text'] { font: inherit; color: #eee; background: #1b1e24; border: 1px solid #3a404a; border-radius: 8px; padding: 8px; width: 9em; user-select: text; -webkit-user-select: text; }
      input[type='color'] { width: 40px; height: 38px; padding: 0; border: 1px solid #3a404a; border-radius: 8px; background: none; }
      select { font: inherit; color: #eee; background: #262a31; border: 1px solid #3a404a; border-radius: 8px; padding: 8px; min-height: 38px; }
      #top { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 6px; align-items: center; padding: max(8px, env(safe-area-inset-top)) 8px 8px; flex-wrap: wrap; background: linear-gradient(#101216ee, #10121600); }
      #top .grow { flex: 1; }
      #add { position: fixed; left: 8px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
      #add .lbl, .lbl { color: #8b93a0; font-size: 11px; letter-spacing: 0.08em; }
      #side { position: fixed; right: 8px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
      #panel { position: fixed; left: 0; right: 0; bottom: 0; background: #15181dee; border-top: 1px solid #2c3139; padding: 8px 8px max(8px, env(safe-area-inset-bottom)); display: none; }
      #panel.open { display: block; }
      .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
      .axis { display: grid; grid-template-columns: 74px 48px 1fr 48px; gap: 6px; align-items: center; margin: 4px 0; }
      .axis .val { text-align: center; background: #1b1e24; border-radius: 8px; padding: 10px 4px; font-variant-numeric: tabular-nums; }
      .axis button { font-size: 20px; padding: 4px; }
      .chips button { padding: 7px 9px; min-height: 34px; }
      #toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: #000c; padding: 9px 14px; border-radius: 8px; display: none; z-index: 9; }
      #modal { position: fixed; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 8; }
      #modal.open { display: flex; }
      #modal .box { background: #1a1d23; border: 1px solid #333; border-radius: 12px; padding: 14px; width: min(92vw, 420px); max-height: 80vh; overflow: auto; }
      #modal .car { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
      #modal .car span { flex: 1; }
      textarea { width: 100%; height: 140px; background: #101216; color: #ddd; border: 1px solid #333; border-radius: 8px; font: 11px monospace; user-select: text; -webkit-user-select: text; }
      body.editing #add, body.editing #side { display: none; }
      /* A phone held upright: the shape buttons go in rows under the top bar and above the hint,
         leaving the car clear in the middle. */
      @media (orientation: portrait) {
        #add { top: auto; bottom: calc(46px + env(safe-area-inset-bottom)); left: 8px; right: 8px; transform: none; flex-direction: row; flex-wrap: wrap; align-items: center; }
        #add button { flex: 1; padding: 9px 4px; }
        #side { top: 116px; right: 8px; transform: none; flex-direction: row; }
      }
      #hint { position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); text-align: center; color: #8b93a0; pointer-events: none; }
    </style>
  </head>
  <body data-mode="artifact">
    <div id="top">
      <button type="button" id="b-back">◀ GAME</button>
      <input type="text" id="name" maxlength="24" placeholder="Car name" aria-label="Car name" />
      <select id="base" aria-label="Drives like">
        <option value="e30">Drives like E30</option>
        <option value="rx7">Drives like RX-7</option>
      </select>
      <input type="color" id="paint" value="#efeee6" aria-label="Paint colour" />
      <span class="grow"></span>
      <button type="button" id="b-undo">UNDO</button>
      <button type="button" id="b-cars">MY CARS</button>
      <button type="button" id="b-save">SAVE</button>
      <button type="button" id="b-drive" class="go">DRIVE IT</button>
    </div>
    <div id="add">
      <span class="lbl">ADD</span>
      <button type="button" data-add="box">BOX</button>
      <button type="button" data-add="wedge">WEDGE</button>
      <button type="button" data-add="taper">TAPER</button>
      <button type="button" data-add="cyl">CYLINDER</button>
      <button type="button" data-add="ball">BALL</button>
      <button type="button" data-add="e30">E30 BODY</button>
      <button type="button" data-add="rx7">RX-7 BODY</button>
    </div>
    <div id="side">
      <button type="button" id="b-ghost">GHOST</button>
      <button type="button" id="b-wheels" class="on">WHEELS</button>
      <button type="button" id="b-view">VIEW</button>
      <button type="button" id="b-code">CODE</button>
    </div>
    <div id="hint">Tap ADD to place a shape · tap a shape to edit it · drag to look around · pinch to zoom</div>
    <div id="panel">
      <div class="row chips" id="modes">
        <button type="button" data-mode="move" class="on">MOVE</button>
        <button type="button" data-mode="size">SIZE</button>
        <button type="button" data-mode="turn">TURN</button>
        <button type="button" data-mode="style">STYLE</button>
        <span class="grow" style="flex: 1"></span>
        <button type="button" id="b-dup">COPY</button>
        <button type="button" id="b-del">DELETE</button>
        <button type="button" id="b-done">✕</button>
      </div>
      <div id="axes"></div>
      <div class="row chips" id="steps"></div>
      <div id="style" style="display: none">
        <div class="row chips" id="mats"></div>
        <div class="row">
          <input type="color" id="pcolor" value="#888888" aria-label="Part colour" />
          <button type="button" id="b-mirror">MIRROR L/R</button>
          <span class="lbl" id="taper-lbl">TOP</span>
          <input type="range" id="taper" min="0.2" max="1" step="0.05" aria-label="Taper" />
        </div>
      </div>
    </div>
    <div id="modal"><div class="box" id="modal-box"></div></div>
    <div id="toast"></div>
    <script type="module" src="/src/builder/builder.js"></script>
  </body>
</html>
